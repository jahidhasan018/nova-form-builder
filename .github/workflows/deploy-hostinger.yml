name: Build and Deploy Plugin (Hostinger)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      DEPLOY_GITHUB_TOKEN: ${{ secrets.DEPLOY_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Detect Node lockfile
        id: node_lock
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "has_lock=true" >> "$GITHUB_OUTPUT"
          elif [[ -f yarn.lock ]]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "has_lock=true" >> "$GITHUB_OUTPUT"
          elif [[ -f pnpm-lock.yaml ]]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "has_lock=true" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "has_lock=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js (with cache when lockfile exists)
        if: steps.node_lock.outputs.has_lock == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.node_lock.outputs.manager }}

      - name: Set up Node.js (without cache when lockfile missing)
        if: steps.node_lock.outputs.has_lock != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node packages
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            echo "No lockfile found; running npm install."
            npm install
          fi

      - name: Build block assets
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Configure Composer GitHub auth (optional)
        if: env.DEPLOY_GITHUB_TOKEN != ''
        run: composer config --global --auth github-oauth.github.com "$DEPLOY_GITHUB_TOKEN"

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Prepare deploy artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='*.md' \
            --exclude='phpunit.xml' \
            --exclude='phpcs.xml' \
            ./ dist/nova-form-builder/

      - name: Prepare remote plugin directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            set -e
            PLUGIN_PATH="${{ secrets.HOSTINGER_PLUGIN_PATH }}"

            mkdir -p "$PLUGIN_PATH"
            find "$PLUGIN_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Upload plugin files to wp-content/plugins
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: dist/nova-form-builder/*
          target: ${{ secrets.HOSTINGER_PLUGIN_PATH }}
          strip_components: 2
